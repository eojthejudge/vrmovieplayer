; Override device profiles for Quest 1 compatibility.
; Cook is done with vr.MobileMultiView=False (AndroidEngine.ini) so only non-MultiView
; shader permutations are compiled. The Android_OpenXR parent profile would enable MultiView
; at runtime, which would crash because MultiView shaders aren't in the cook.
; This override keeps Quest 1 at MultiView=0, matching the cook-time setting.
[Oculus_Quest DeviceProfile]
+CVars=vr.MobileMultiView=0
